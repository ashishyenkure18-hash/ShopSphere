{% extends "base.html" %}
{% block content %}
<h2>My Orders</h2>
<div id="orders-list">Loading...</div>
{% endblock %}

{% block scripts %}
<script>
(async () => {
  const token = localStorage.getItem("token");
  if (!token) { location.href = "/login"; return; }
  const r = await fetch("/api/orders", { headers: { "Authorization": `Bearer ${token}` } });
  const { orders } = await r.json();
  document.getElementById("orders-list").innerHTML = orders.length ? `
    <table class="table">
      <thead><tr><th>Order #</th><th>Date</th><th>Total</th><th>Payment</th><th>Status</th><th></th></tr></thead>
      <tbody>
        ${orders.map(o => `
          <tr>
            <td>#${o.id}</td>
            <td>${new Date(o.created_at).toLocaleDateString()}</td>
            <td>₹${o.total_amount}</td>
            <td>${o.payment_status}</td>
            <td><span class="badge">${o.order_status}</span></td>
            <td><a href="/order/${o.id}" class="btn small">Track</a></td>
          </tr>`).join("")}
      </tbody>
    </table>` : "<p>No orders yet.</p>";
})();
</script>
{% endblock %}
