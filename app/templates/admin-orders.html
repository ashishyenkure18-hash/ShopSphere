{% extends "base.html" %}
{% block content %}
<h2>Orders</h2>
<div id="orders"></div>
{% endblock %}

{% block scripts %}
<script>
const token = localStorage.getItem("token");
const authHeaders = { "Authorization": `Bearer ${token}`, "Content-Type": "application/json" };
const STATUSES = ["Pending", "Confirmed", "Processing", "Shipped", "Out for Delivery", "Delivered", "Cancelled"];

async function load() {
  const r = await fetch("/api/admin/orders", { headers: authHeaders });
  if (!r.ok) { document.getElementById("orders").innerText = "Admin only"; return; }
  const { orders } = await r.json();
  document.getElementById("orders").innerHTML = `
    <table class="table">
      <thead><tr><th>ID</th><th>User</th><th>Total</th><th>Payment</th><th>Status</th><th>Change</th></tr></thead>
      <tbody>
        ${orders.map(o => `
          <tr>
            <td>#${o.id}</td>
            <td>${o.user_id}</td>
            <td>₹${o.total_amount}</td>
            <td>${o.payment_status}</td>
            <td>${o.order_status}</td>
            <td>
              <select data-id="${o.id}">
                ${STATUSES.map(s => `<option ${s === o.order_status ? 'selected' : ''}>${s}</option>`).join("")}
              </select>
            </td>
          </tr>`).join("")}
      </tbody>
    </table>`;

  document.querySelectorAll("select[data-id]").forEach(sel => {
    sel.onchange = async () => {
      await fetch(`/api/orders/${sel.dataset.id}/status`, {
        method: "PUT", headers: authHeaders,
        body: JSON.stringify({ order_status: sel.value }),
      });
      alert("Status updated");
    };
  });
}
load();
</script>
{% endblock %}
